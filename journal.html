<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: pink;
    }

    h1 {
      text-align: center;
      font-family: "Titan One", sans-serif;
      font-weight: 100;
    }

    p {
      font-family: "Titan One", sans-serif;
      font-weight: 100;
    }

    .app {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: flex-start;
    }

    .note,
    .btn {
      width: 280px;
      min-height: 230px;
      box-sizing: border-box;
      border-radius: 22px;
    }

    .note {
      padding: 24px;
      resize: none;
      border: 10px solid rgba(225, 6, 218, 0.1);
      outline: none;
    }

    .btn {
      display: grid;
      place-content: center;
      gap: 12px;
      background-color: rgb(243, 28, 196);
      font-size: 20px;
      font-family: "Titan One", sans-serif;
      font-weight: 400;
      font-style: normal;
      color: rgb(255, 222, 255);
      border: 10px solid rgba(255, 179, 252, 0.9);
      box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <h1>Journal</h1>
  <hr>

  <p><a href="index.html">Back to home page</a></p>
  <p>What's in your mind today?</p>

  <section class="app" id="app" aria-label="Your notes">
    <button class="btn" id="btn" aria-label="Add a note">
      + NEW ENTRY
    </button>
  </section>
  <script src="journal.js"></script>
</body>
</html>
